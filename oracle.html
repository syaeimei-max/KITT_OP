        <main id="mainContent" class="flex-1 flex flex-col items-center p-6 z-10 w-full overflow-y-auto relative">

                        <div id="estDiff" class="text-lg font-bold text-slate-500 px-3 py-1 rounded bg-slate-800 relative z-10 border border-slate-600 shadow">較基準: ---</div>

    <script>
        function calcOpen() {
            let txBase = parseFloat(document.getElementById('txBase').value) || 0;
            let twnBase = parseFloat(document.getElementById('twnBase').value) || 0;
            let usdBase = parseFloat(document.getElementById('usdBase').value) || 0;
            
            let twnReal = parseFloat(document.getElementById('twnReal').value) || 0;
            let usdReal = parseFloat(document.getElementById('usdReal').value) || 0;

            let elEst = document.getElementById('estOpen');
            let elDiff = document.getElementById('estDiff');

            if (twnBase > 0 && twnReal > 0) {
                let multiplier = txBase / twnBase;
                let fxRatio = (usdBase > 0 && usdReal > 0) ? (usdReal / usdBase) : 1.0;
                
                let estOpen = twnReal * multiplier * fxRatio;
                let diff = estOpen - txBase;
                
                let isUp = diff >= 0;
                let colorClass = isUp ? "text-rose-500" : "text-emerald-500";
                let sign = isUp ? "+" : "";

                elEst.className = `text-5xl font-black mb-4 transition-colors drop-shadow-md relative z-10 ${colorClass}`;
                elEst.innerText = Math.round(estOpen).toLocaleString();

                elDiff.className = `text-xl font-bold px-4 py-1 rounded bg-slate-800/80 drop-shadow relative z-10 border border-slate-600 ${colorClass}`;
                elDiff.innerText = `較基準上漲/下跌: ${sign}${Math.round(diff).toLocaleString()} 點`;
            } else {
                elEst.className = "text-4xl font-black text-slate-600 mb-4 transition-colors relative z-10";
                elEst.innerText = "---";
                elDiff.className = "text-lg font-bold text-slate-500 px-3 py-1 rounded bg-slate-800/80 relative z-10 border border-slate-600 shadow";
                elDiff.innerText = "較基準: ---";
            }
        }
    </script>
