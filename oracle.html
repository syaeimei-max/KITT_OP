        <main id="mainContent" class="flex-1 flex flex-col items-center p-6 z-10 w-full overflow-y-auto relative">

                    </div>
                    
                    <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700">
                        <label class="block text-sm font-medium text-slate-400 mb-2">富台指 05:10</label>
                        <input type="number" step="0.01" id="twnBase" value="3989.00" class="w-full bg-slate-950 border border-slate-600 rounded-lg px-4 py-3 text-2xl font-bold text-white focus:outline-none focus:border-blue-500 transition-colors" oninput="calcOpen()">
                    </div>
                    
                    <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700">
                        <label class="block text-sm font-medium text-slate-400 mb-2">USD/TWD 基準</label>
                        <input type="number" step="0.001" id="usdBase" value="33.115" class="w-full bg-slate-950 border border-slate-600 rounded-lg px-4 py-3 text-2xl font-bold text-white focus:outline-none focus:border-blue-500 transition-colors" oninput="calcOpen()">
                    </div>
                </div>

                <!-- 右側：即時輸入與結果輸出區 -->

                    <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700 space-y-6 mb-8">
                        <div>
                            <label class="block text-sm font-bold text-[#C1E11D] mb-2 flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-[#C1E11D] animate-pulse"></span> 富台即時現價
                            </label>
                            <input type="number" step="0.01" id="twnReal" placeholder="輸入富台現價" class="w-full bg-slate-950 border-2 border-[#C1E11D]/50 rounded-lg px-3 py-2 text-lg font-black text-white focus:outline-none focus:border-[#C1E11D] transition-colors shadow-inner" oninput="calcOpen()">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-[#C1E11D] mb-2 flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-[#C1E11D] animate-pulse"></span> 即時匯率
                            </label>
                            <input type="number" step="0.001" id="usdReal" placeholder="輸入即時匯率" class="w-full bg-slate-950 border-2 border-[#C1E11D]/50 rounded-lg px-3 py-2 text-lg font-black text-white focus:outline-none focus:border-[#C1E11D] transition-colors shadow-inner" oninput="calcOpen()">
                        </div>
                    </div>

                    <!-- 輸出結果 -->

                        <span class="text-sm font-bold tracking-widest text-slate-400 mb-2 relative z-10">預估開盤點數</span>
                        <div id="estOpen" class="text-4xl font-black text-slate-600 mb-4 transition-colors relative z-10">---</div>
                        <div id="estDiff" class="text-lg font-bold text-slate-500 px-3 py-1 rounded bg-slate-800 relative z-10 border border-slate-600 shadow">較基準: ---</div>
                    </div>
                </div>
            </div>

    </main>

    <script>
        function calcOpen() {
            let txBase = parseFloat(document.getElementById('txBase').value) || 0;
            let twnBase = parseFloat(document.getElementById('twnBase').value) || 0;
            let usdBase = parseFloat(document.getElementById('usdBase').value) || 0;
            
            let twnReal = parseFloat(document.getElementById('twnReal').value) || 0;
            let usdReal = parseFloat(document.getElementById('usdReal').value) || 0;

            let elEst = document.getElementById('estOpen');
            let elDiff = document.getElementById('estDiff');

            if (twnBase > 0 && twnReal > 0) {
                let multiplier = txBase / twnBase;
                let fxRatio = (usdBase > 0 && usdReal > 0) ? (usdReal / usdBase) : 1.0;
                
                let estOpen = twnReal * multiplier * fxRatio;
                let diff = estOpen - txBase;
                
                let isUp = diff >= 0;
                let colorClass = isUp ? "text-rose-500" : "text-emerald-500";
                let sign = isUp ? "+" : "";

                elEst.className = `text-5xl font-black mb-4 transition-colors drop-shadow-md relative z-10 ${colorClass}`;
                elEst.innerText = Math.round(estOpen).toLocaleString();

                elDiff.className = `text-xl font-bold px-4 py-1 rounded bg-slate-800/80 drop-shadow relative z-10 border border-slate-600 ${colorClass}`;
                elDiff.innerText = `較基準上漲/下跌: ${sign}${Math.round(diff).toLocaleString()} 點`;
            } else {
                elEst.className = "text-4xl font-black text-slate-600 mb-4 transition-colors relative z-10";
                elEst.innerText = "---";
                elDiff.className = "text-lg font-bold text-slate-500 px-3 py-1 rounded bg-slate-800/80 relative z-10 border border-slate-600 shadow";
                elDiff.innerText = "較基準: ---";
            }
        }
    </script>
