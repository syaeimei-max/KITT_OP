    <script>
        // ===== D2 翻譯字典 (從 D2_DDE_數據中心.pyw 移植) =====
        const TRANSLATE = {

            "CPI m/m": "CPI 月率", "CPI y/y": "CPI 年率",

            "FOMC Statement": "FOMC 聲明",
            "GDP q/q": "GDP 季率", "GDP y/y": "GDP 年率",
            "Retail Sales m/m": "零售銷售 月率",
            "ISM Manufacturing PMI": "ISM 製造業 PMI",
            "ISM Services PMI": "ISM 服務業 PMI",
            "Trade Balance": "貿易帳",
            "PPI m/m": "PPI 月率",
            "RBA Rate Statement": "澳洲央行聲明",
            "BOJ Policy Rate": "日本央行利率",
            "ECB Main Refinancing Rate": "歐洲央行再融資利率",
            "BOE Official Bank Rate": "英國央行利率",
            "Employment Change q/q": "就業變動 季率",
            "Monetary Policy Statement": "貨幣政策聲明",
            "FOMC Press Conference": "FOMC 記者會",
            "Crude Oil Inventories": "原油庫存",
            "FOMC Meeting Minutes": "FOMC 會議紀錄",
            "SNB Policy Rate": "瑞士央行利率",
            "Flash Manufacturing PMI": "製造業PMI初值",
            "Flash Services PMI": "服務業PMI初值",
            "Flash Composite PMI": "綜合PMI初值",
            "Unemployment Claims": "初請失業金",
            "Building Permits": "營建許可",
            "Existing Home Sales": "成屋銷售",
            "New Home Sales": "新屋銷售",
            "Speaks": "發言",
            "Gov": "央行總裁",
            "Chair": "主席",
            "Official": "官員",
            "Speech": "演說",
            "French": "法",
            "German": "德",
            "Spanish": "西",
            "Italian": "義",
            "Final": "終值",
            "Flash": "初值",
            "Manufacturing": "製造",
            "Services": "服務",
            "Unemployment": "失業",
            "Consumer Sentiment": "消心",
            "Change": "變動",
            "Trimmed Mean CPI q/q": "截尾均值CPI 季率",
            "Median CPI y/y": "Median CPI 年率",
            "Claimant Count Change": "Claimant Count 變動",
            "Employment Change": "Employment 變動",
            "Philly Fed Manufacturing Index": "Philly Fed 製造 Index",
        };

        // ===== D2 國家代碼對照 =====
        const COUNTRY = {
            "USD": "US 美國", "EUR": "EU 歐元區", "GBP": "GB 英國",
            "JPY": "JP 日本", "AUD": "AU 澳洲", "CAD": "CA 加拿大",
            "CHF": "CH 瑞士", "NZD": "NZ 紐西蘭", "CNY": "CN 中國",
        };

        // ===== 翻譯函數：多重替換 =====
        function translateTitle(title) {
            let result = title;
            for (const [eng, chi] of Object.entries(TRANSLATE)) {
                result = result.replace(eng, chi);
            }
            return result;
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchCalendar();
        });

        async function fetchCalendar() {
            const GAS_URL = "https://script.google.com/macros/s/AKfycbw2FMlLYCU1h3nRijUHfZKuKXyZeu4_DrYGR393_z3hB4HRwQctwapoPnPK2EKY4qXL_g/exec";
            const tbody = document.getElementById('calBody');
            const CACHE_KEY = 'kitt_cache_data_calendar';
            const CACHE_TIME_KEY = 'kitt_cache_time_calendar';
            const CACHE_DURATION = 3 * 60 * 60 * 1000; // 3 小時
            
            // 1. 檢查有效暫存
            const cachedDataStr = localStorage.getItem(CACHE_KEY);
            const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
            const now = Date.now();

            if (cachedDataStr && cachedTime && (now - parseInt(cachedTime) < CACHE_DURATION)) {
                try {
                    const data = JSON.parse(cachedDataStr);
                    renderCalendar(data);
                    return; // 使用暫存，結束函數
                } catch (e) {
                    console.error("Cache parsing error", e);
                }
            }

            try {
                const response = await fetch(GAS_URL + "?type=calendar");
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                
                // GAS 可能回傳錯誤物件 {status: "error", message: "..."}
                if (data && data.status === "error") {
                    throw new Error(data.message || "GAS 回傳錯誤");
                }
                if (!Array.isArray(data)) throw new Error('回傳格式異常');

                // 寫入暫存
                localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                localStorage.setItem(CACHE_TIME_KEY, now.toString());

                renderCalendar(data);

            } catch (error) {
                console.error(error);
                // 網路失敗時若有舊暫存則顯示
                if (cachedDataStr) {
                    try {
                        const data = JSON.parse(cachedDataStr);
                        renderCalendar(data);
                        return;
                    } catch(e) {}
                }
                tbody.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-red-400">行事曆載入失敗，請確認本機 K2 已產出資料。</td></tr>`;
            }
        }

        function renderCalendar(data) {
            const tbody = document.getElementById('calBody');
            
            try {
                // ===== 智慧過濾 (D2 邏輯) =====
                const now = new Date();
            // 台北時間的今天日期字串 (YYYY-MM-DD)
            const todayTag = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0');

                const filtered = [];
                for (const item of data) {
                    const itemDate = (item.date || '').substring(0, 10);
                    const impact = item.impact || '';

                    // 今日與未來：接受 High + Medium；歷史：只接受 High
                    if (itemDate >= todayTag) {
                        if (impact !== 'High' && impact !== 'Medium') continue;
                    } else {
                        if (impact !== 'High') continue;
                    }

                    // ===== 時區轉換：ET (UTC-4) → 台北 (UTC+8)，加 12 小時 =====
                    let displayTime = '';
                    let displayDate = itemDate;
                    try {
                        const dt = new Date(item.date.substring(0, 19));
                        dt.setHours(dt.getHours() + 12);
                        displayDate = String(dt.getMonth() + 1).padStart(2, '0') + '/' +
                                      String(dt.getDate()).padStart(2, '0');
                        displayTime = String(dt.getHours()).padStart(2, '0') + ':' +
                                      String(dt.getMinutes()).padStart(2, '0');
                    } catch (e) {
                        displayTime = '';
                    }

                    // ===== 翻譯 =====
                    const titleCn = translateTitle(item.title || '');
                    const countryCn = COUNTRY[item.country] || item.country;

                    // ===== 星等 =====
                    let stars = '';
                    if (impact === 'High') stars = "<span class='star-high text-lg tracking-widest'>★★★</span>";
                    else if (impact === 'Medium') stars = "<span class='star-med text-lg tracking-widest'>★★</span>";
                    else stars = "<span class='text-slate-600 text-lg'>★</span>";

                    filtered.push({
                        sortKey: displayDate + ' ' + displayTime,
                        displayDate, displayTime, countryCn, stars, titleCn,
                        forecast: item.forecast || '-',
                        previous: item.previous || '-',
                    });
                }

                // ===== 排序：由未來排到過去 (最新置頂) =====
                filtered.sort((a, b) => b.sortKey.localeCompare(a.sortKey));

                tbody.innerHTML = '';

                if (filtered.length > 0) {
                    filtered.forEach((item, index) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="text-center text-slate-500 font-mono">${index + 1}</td>
                            <td class="text-slate-300 font-mono">${item.displayDate} ${item.displayTime}</td>
                            <td class="text-slate-300">${item.countryCn}</td>
                            <td>${item.stars}</td>
                            <td class="text-blue-200 font-medium">${item.titleCn}</td>
                            <td class="text-slate-300 font-mono">${item.forecast}</td>
                            <td class="text-slate-400 font-mono">${item.previous}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-20 text-slate-500">本週無高/中級別重大財經事件。</td></tr>`;
                }
            } catch (err) {
                console.error('財經行事曆抓取失敗:', err);
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-20 text-red-400">❌ 取得財經日曆失敗，請檢查網路連線。<br><small class="text-slate-500">${err.message}</small></td></tr>`;
            }
        }
    </script>
